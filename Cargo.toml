[package]
name = "aurora-wm"
version = "0.3.0"
edition = "2024"

[dependencies]
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
rusttype = "0.9.3"
time = { version = "0.3.44", features = ["formatting", "local-offset"] }
x11rb = { version = "0.13.2", default-features = false, features = ["image", "composite", "damage", "render", "screensaver", "shape", "xfixes", "xtest"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
